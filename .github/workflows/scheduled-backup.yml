name: Scheduled Nightly Backup (GCS)

on:
  schedule:
    # 04:15 UTC daily (staggered slightly after mintedpanel)
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (validate process without modifying cloud storage)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: minted-extension-scheduled-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Execute Extension Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare workspace and date
        run: |
          BACKUP_DATE=$(date -u +%Y-%m-%d)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          WORKSPACE="${RUNNER_TEMP}/backup-artifacts"
          mkdir -p "${WORKSPACE}/extension"
          
          SHORT_SHA=$(git rev-parse --short=10 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          BUNDLE_NAME="minted-extension-repo-${TIMESTAMP}-${SHORT_SHA}.bundle"
          BUNDLE_PATH="${WORKSPACE}/extension/${BUNDLE_NAME}"
          
          # Create git bundle
          git bundle create "${BUNDLE_PATH}" --all
          
          # Compute sha256 checksum
          sha256sum "${BUNDLE_PATH}" | awk '{print $1}' > "${BUNDLE_PATH}.sha256"
          SHA256=$(cat "${BUNDLE_PATH}.sha256")
          
          # Generate manifest
          cat <<EOF > "${WORKSPACE}/extension/manifest.json"
          {
            "version": 1,
            "artifactType": "git-bundle",
            "repo": "sonny303/minted-extension",
            "sha256": "${SHA256}",
            "headSha": "${FULL_SHA}",
            "createdAt": "${TIMESTAMP}"
          }
          EOF
          
          echo "BACKUP_DATE=${BACKUP_DATE}" >> "$GITHUB_ENV"
          echo "WORKSPACE=${WORKSPACE}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: ${{ !inputs.dry_run }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Upload Artifacts to Google Cloud Storage
        if: ${{ !inputs.dry_run }}
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ env.WORKSPACE }}
          destination: "${{ secrets.GCS_BACKUP_BUCKET }}/backups/${{ env.BACKUP_DATE }}"
          parent: false
          process_gcloudignore: false

      - name: Archive Fallback Artifacts (GitHub Retention: 7 Days)
        uses: actions/upload-artifact@v4
        with:
          name: minted-extension-backup-${{ env.BACKUP_DATE }}
          path: ${{ env.WORKSPACE }}
          retention-days: 7
          if-no-files-found: warn
